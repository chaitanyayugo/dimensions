<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensions | Luxury 3D</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader">
        <h1 class="loader-logo">DIMENSIONS</h1>
    </div>

    <div class="artistic-bg"></div>
    <div id="dust-container"></div>

    <nav class="navbar">
        <div class="logo">DIMENSIONS</div>
        <div class="nav-links">
            <a href="#">Gallery</a>
            <a href="#">Heritage</a>
            <a href="#">Reserve</a>
        </div>
    </nav>

    <div class="sofa-wrapper">
        <img src="sofa-child.png" id="animated-sofa" alt="Luxury Sofa">
        <div id="sofa-shadow"></div>
    </div>

    <main class="scroll-container">
        <section class="panel center-text">
            <div class="hero-box">
                <h1>The <span class="gold-text">360°</span> Standard</h1>
                <p>Scroll to witness the dimension of comfort.</p>
            </div>
        </section>

        <section class="panel left-text">
            <div class="content-box">
                <h2>Ergonomic Design</h2>
                <p>Crafted for the human form, providing support where it matters most.</p>
            </div>
        </section>

        <section class="panel right-text">
            <div class="content-box">
                <h2>Master Craftsmanship</h2>
                <p>Every stitch tells a story of heritage and luxury.</p>
            </div>
        </section>

        <section class="panel center-text">
            <div class="hero-box">
                <h1>Pure <span class="gold-text">Elegance</span></h1>
                <a href="#" class="cta-button">Order Now</a>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
